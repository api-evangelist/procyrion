aid: procyrion
name: Procyrion
description: 'Procyrion, Inc. is a privately held, clinical-stage medical device company
  headquartered in Houston, Texas, developing Aortix, a catheter-deployed percutaneous
  mechanical circulatory support (pMCS) pump. Aortix is placed in the descending thoracic
  aorta and uses fluid entrainment to unload the heart and increase perfusion to the
  kidneys, targeting acute decompensated heart failure with diuretic resistance, prevention
  of acute kidney injury during cardiac surgery, cardiac unloading to limit myocardial
  infarct size, and longer-term chronic heart failure therapy. The device is under
  investigation in the DRAIN-HF pivotal IDE trial and is limited by federal law to
  investigational use; it is not approved for sale in any geography. Procyrion is a
  medical hardware and clinical company - it publishes no developer program, public API,
  SDK, or machine-readable API contract.'
