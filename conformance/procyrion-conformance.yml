  name: ISO 13485:2016 - Medical devices, quality management systems
  conforms: true
  status: certified
  evidence: >-
    Procyrion announced ISO 13485:2016 certification for its medical device and quality
    management systems in May 2018, on its own press-release page.
  source: https://www.procyrion.com/news/procyrion-inc-announces-iso-13485-2016-certification
  note: >-
    This is a device-manufacturing quality certification, not a published information
    security or API compliance program, so it does not earn a `Compliance` pointer in
    apis.yml. Recorded here for what it is.
