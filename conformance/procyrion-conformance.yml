scope: >-
  Procyrion publishes no API, so there are no API or cross-cutting technical standards to
  assert. What it is actually measured against is the US medical device regulatory pathway
  and the medical device quality-management standard. Those are recorded here as the
  applicable regimes, with status stated honestly. The API/protocol standards block below
  is recorded as not-applicable rather than false, so this file is never mistaken for an
  API posture the company does not claim.
